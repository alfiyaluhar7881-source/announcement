<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samaj Announcement Form</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta property="og:title" content="समाज सूचना फॉर्म">
<meta property="og:description" content="खबर इंतक़ाल, जियारत, फातेहा, शादी और मीटिंग की सूचना भेजें">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Noto+Serif+Devanagari:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one phone-first column — language switch, type tiles, form sections, card preview, one send button */
:root {
  --bg: #f2f4ef;
  --card: #ffffff;
  --fg: #1b2420;
  --muted: #5d6a63;
  --line: #d4dcd6;
  --accent: #0f7a4a;
  --accent-ink: #ffffff;
  --marigold: #a77b16;
  --tile-on: #fff6dd;
  --bubble: #dcf8c6;
  --bubble-ink: #1b2420;
  --error: #b3261e;
  --font: "Mukta", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --card: #19201d; --fg: #e6ece8; --muted: #9eaba4; --line: #2d3833;
    --accent: #2bb673; --accent-ink: #07140d; --marigold: #e8b23a; --tile-on: #2e2812;
    --bubble: #1f4a33; --bubble-ink: #e6ece8; --error: #f2958c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --card: #19201d; --fg: #e6ece8; --muted: #9eaba4; --line: #2d3833;
  --accent: #2bb673; --accent-ink: #07140d; --marigold: #e8b23a; --tile-on: #2e2812;
  --bubble: #1f4a33; --bubble-ink: #e6ece8; --error: #f2958c;
  color-scheme: dark;
}
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 600px; margin: 0 auto; display: grid; gap: 18px; }
.stack { display: grid; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.6rem; font-weight: 800; margin: 0; line-height: 1.15; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.95rem; }
.lang, .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.lang button, .seg button { font: inherit; font-size: 0.95rem; font-weight: 600; border: 0; background: transparent; color: var(--fg); padding: 6px 14px; cursor: pointer; }
.lang button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg { display: grid; grid-template-columns: 1fr 1fr; }
.seg button { padding: 10px 12px; }
.step { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--marigold); margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile {
  font: inherit; font-size: 0.88rem; font-weight: 600; line-height: 1.2; color: var(--fg);
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 10px 4px; display: grid; justify-items: center; gap: 4px; cursor: pointer; text-align: center;
}
.tile .ic { font-size: 1.5rem; line-height: 1; }
.tile[aria-pressed="true"] { border-color: var(--marigold); background: var(--tile-on); }
.tile:focus-visible, .btn:focus-visible, .lang button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.card h2 { font-size: 1.05rem; font-weight: 800; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field label { font-weight: 600; }
.req { color: var(--error); }
.opt { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
input, textarea, select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; width: 100%; box-sizing: border-box; min-height: 48px;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--error); }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.switch input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }
.err { color: var(--error); font-weight: 600; font-size: 0.92rem; }
.bubble {
  background: var(--bubble); color: var(--bubble-ink); border-radius: 12px 12px 12px 3px;
  padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.98rem; min-height: 60px;
}
.btn {
  font: inherit; font-weight: 800; font-size: 1.1rem; border-radius: 12px; padding: 14px 18px;
  min-height: 56px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--accent); text-align: center; width: 100%; box-sizing: border-box;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-small { min-height: 40px; padding: 8px 14px; font-size: 0.95rem; width: auto; }
.actions { display: grid; gap: 10px; }
.note { color: var(--muted); font-size: 0.9rem; white-space: pre-line; }
.note.guide { background: var(--tile-on); border: 1.5px solid var(--marigold); border-radius: 12px; padding: 14px 16px; color: var(--fg); font-size: 1.05rem; font-weight: 600; line-height: 1.6; }
.example-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--tile-on); border: 1px solid var(--marigold); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.card-preview { display: grid; justify-items: center; }
.card-preview canvas { width: 100%; max-width: 440px; height: auto; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details .bubble { margin-top: 10px; }
@media (max-width: 380px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="tTitle"></h1>
      <p class="sub" id="tSub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langHi" aria-pressed="false">हिंदी</button>
      <button type="button" id="langEn" aria-pressed="false">English</button>
    </div>
  </div>

  <section>
    <div class="step" id="tStep1"></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- ===================== KHABAR INTEQAL (death news) ===================== -->
  <div id="deathSection" class="stack">
    <div class="example-bar" id="exampleBar" hidden>
      <span data-t="exampleNote"></span>
      <button class="btn btn-ghost btn-small" type="button" id="clearDeath" data-t="clearAll"></button>
    </div>

    <div class="card">
      <h2 data-t="secType"></h2>
      <div class="field">
        <label for="d_kind"><span data-t="kindLabel"></span> <span class="req">*</span></label>
        <select id="d_kind"></select>
      </div>
    </div>

    <div class="card">
      <h2 data-t="secPerson"></h2>
      <div class="grid2">
        <div class="field">
          <label for="d_gender"><span data-t="genderLabel"></span> <span class="req">*</span></label>
          <select id="d_gender"></select>
        </div>
        <div class="field">
          <label for="d_age"><span data-t="ageLabel"></span> <span class="opt" data-t="optional"></span></label>
          <input id="d_age" type="number" inputmode="numeric" min="0" max="130" data-ph="agePh">
        </div>
      </div>
      <div class="field" id="w_name">
        <label for="d_name"><span data-t="nameLabel"></span> <span class="req">*</span></label>
        <input id="d_name" data-ph="namePh">
      </div>
      <div class="field">
        <label for="d_urf"><span data-t="urfLabel"></span> <span class="opt" data-t="optional"></span></label>
        <input id="d_urf" data-ph="urfPh">
      </div>
      <div class="field" id="g_family">
        <label for="d_family"><span data-t="familyLabel"></span> <span class="opt" data-t="optional"></span></label>
        <input id="d_family" data-ph="familyPh">
      </div>
      <div class="field" id="g_cause">
        <label for="d_cause" data-t="causeLabel"></label>
        <select id="d_cause"></select>
      </div>
    </div>

    <div class="card">
      <h2 data-t="secPlace"></h2>
      <div class="grid2">
        <div class="field" id="w_city">
          <label for="d_city"><span data-t="cityLabel"></span> <span class="req">*</span></label>
          <input id="d_city" data-ph="cityPh">
        </div>
        <div class="field">
          <label for="d_state" data-t="stateLabel"></label>
          <select id="d_state"></select>
        </div>
      </div>
      <div class="field" id="w_date">
        <label for="d_date"><span data-t="dateLabel"></span> <span class="req">*</span> <span class="opt" id="d_dayShow"></span></label>
        <input id="d_date" type="date">
      </div>
      <div class="field">
        <label for="d_address"><span data-t="addressLabel"></span> <span class="opt" data-t="optional"></span></label>
        <input id="d_address" data-ph="addressPh">
      </div>
    </div>

    <div class="card" id="sec_tadfin">
      <h2 data-t="secTadfin"></h2>
      <div class="grid2">
        <div class="field" id="w_tadfinDate">
          <label for="d_tadfinDate"><span data-t="dateLabel"></span> <span class="req">*</span></label>
          <input id="d_tadfinDate" type="date">
        </div>
        <div class="field">
          <label for="d_tadfinWhen" data-t="whenLabel"></label>
          <select id="d_tadfinWhen" class="when-select"></select>
        </div>
      </div>
      <div class="field">
        <label for="d_tadfinTime"><span data-t="timeLabel"></span> <span class="opt" data-t="optional"></span></label>
        <input id="d_tadfinTime" type="time">
      </div>
      <div class="field">
        <label for="d_janaza" data-t="janazaLabel"></label>
        <input id="d_janaza" data-ph="janazaPh">
      </div>
      <div class="field">
        <label for="d_qabristan" data-t="qabristanLabel"></label>
        <input id="d_qabristan" data-ph="qabristanPh">
      </div>
    </div>

    <div class="card" id="sec_ziyarat">
      <label class="switch" id="sw_ziyarat"><input type="checkbox" id="d_addZiyarat"> <span data-t="addZiyarat"></span></label>
      <h2 id="h_ziyarat" data-t="secZiyarat" hidden></h2>
      <div id="body_ziyarat" class="stack" style="gap:14px">
        <div class="grid2">
          <div class="field" id="w_ziyaratDate">
            <label for="d_ziyaratDate" data-t="dateLabel"></label>
            <input id="d_ziyaratDate" type="date">
          </div>
          <div class="field">
            <label for="d_ziyaratWhen" data-t="whenLabel"></label>
            <select id="d_ziyaratWhen" class="when-select"></select>
          </div>
        </div>
        <div class="field">
          <label for="d_ziyaratTime"><span data-t="timeLabel"></span> <span class="opt" data-t="optional"></span></label>
          <input id="d_ziyaratTime" type="time">
        </div>
        <div class="field">
          <label for="d_ziyaratPlace" data-t="placeLabel"></label>
          <input id="d_ziyaratPlace" data-ph="ziyaratPlacePh">
        </div>
      </div>
    </div>

    <div class="card" id="sec_fateha">
      <label class="switch" id="sw_fateha"><input type="checkbox" id="d_addFateha"> <span data-t="addFateha"></span></label>
      <h2 id="h_fateha" data-t="secFateha" hidden></h2>
      <div id="body_fateha" class="stack" style="gap:14px">
        <div class="grid2">
          <div class="field" id="w_fatehaDate">
            <label for="d_fatehaDate" data-t="dateLabel"></label>
            <input id="d_fatehaDate" type="date">
          </div>
          <div class="field">
            <label for="d_fatehaWhen" data-t="whenLabel"></label>
            <select id="d_fatehaWhen" class="when-select"></select>
          </div>
        </div>
        <div class="field">
          <label for="d_fatehaTime"><span data-t="timeLabel"></span> <span class="opt" data-t="optional"></span></label>
          <input id="d_fatehaTime" type="time">
        </div>
        <div class="field">
          <label for="d_fatehaPlace" data-t="placeLabel"></label>
          <input id="d_fatehaPlace" data-ph="fatehaPlacePh">
        </div>
      </div>
    </div>

    <div class="card" id="sec_more">
      <h2><span data-t="secMore"></span> <span class="opt" data-t="optional"></span></h2>
      <div class="field">
        <label for="d_jawai" data-t="jawaiLabel"></label>
        <input id="d_jawai" data-ph="jawaiPh">
      </div>
      <div class="field">
        <label for="d_pihar" data-t="piharLabel"></label>
        <input id="d_pihar" data-ph="piharPh">
      </div>
    </div>

    <div class="card">
      <h2 data-t="secBy"></h2>
      <div class="field">
        <label for="d_by"><span data-t="byLabel"></span> <span class="opt" data-t="byHint"></span></label>
        <textarea id="d_by" data-ph="byPh"></textarea>
      </div>
      <div class="field">
        <label for="d_group"><span data-t="groupLabel"></span> <span class="opt" data-t="optional"></span></label>
        <input id="d_group">
      </div>
    </div>

    <section>
      <div class="step" data-t="stepSend"></div>
      <div class="card">
        <div class="field">
          <span style="font-weight:600" data-t="sendModeLabel"></span>
          <div class="seg" role="group">
            <button type="button" id="modeCard" aria-pressed="true" data-t="modeCard"></button>
            <button type="button" id="modeText" aria-pressed="false" data-t="modeText"></button>
          </div>
        </div>
        <div class="card-preview" id="cardPreview"><canvas id="cardCanvas" width="1080" height="1620" aria-label="Card preview"></canvas></div>
        <details id="textDetails">
          <summary data-t="viewText"></summary>
          <div class="bubble" id="deathText"></div>
        </details>
        <div class="err" id="deathErr" hidden></div>
        <button class="btn btn-primary" type="button" id="sendDeath" data-t="sendBtn"></button>
        <div class="note" id="deathNote"></div>
      </div>
    </section>
  </div>

  <p class="note" style="text-align:center">Version 8 · centred text fix</p>

  <!-- ===================== OTHER ANNOUNCEMENTS ===================== -->
  <div id="genericSection" class="stack" hidden>
    <section>
      <div class="step" id="tStep2"></div>
      <form class="card" id="form" novalidate>
        <div id="fields" class="stack" style="gap:14px"></div>
        <div class="field">
          <label for="f_extra"><span id="tExtra"></span> <span class="opt" id="tOpt1"></span></label>
          <textarea id="f_extra"></textarea>
        </div>
        <div class="field">
          <label for="f_sender"><span id="tSender"></span> <span class="opt" id="tOpt2"></span></label>
          <input id="f_sender">
        </div>
      </form>
    </section>
    <section>
      <div class="step" id="tStep3"></div>
      <div class="card">
        <div class="bubble" id="preview"></div>
        <div class="err" id="errBox" hidden></div>
        <a class="btn btn-primary" id="sendLink" href="https://wa.me/" target="_blank" rel="noopener"></a>
        <button class="btn btn-ghost" type="button" id="copyBtn" hidden></button>
        <div class="note" id="note"></div>
      </div>
    </section>
  </div>
</div>

<script>
// =====================================================================
// SETTINGS
// =====================================================================

// Leave empty: WhatsApp asks which chat/group to send to.
// Put the admin's number (country code + number, digits only, e.g. "919876543210")
// if every message should go to the admin first for checking.
var SEND_TO_NUMBER = "";

// Group name printed at the bottom of every card and message.
var DEFAULT_GROUP_LINE = "1/ऑल इंडिया जयपुरी लोहार जमात ग्रुप";

// true = show an example announcement when the page opens.
var FILL_EXAMPLE = false;

// =====================================================================
// COMMON HELPERS
// =====================================================================

var currentLang = "hi";

var DAY_NAMES = {
  hi: ["इतवार", "सोमवार", "मंगलवार", "बुधवार", "जुमेरात", "जुम्मा", "शनिवार"],
  en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"]
};

function getById(id) {
  return document.getElementById(id);
}

function readInput(id) {
  var element = getById(id);
  if (!element) { return ""; }
  return element.value.trim();
}

function isoFromDate(d) {
  var month = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + month + "-" + day;
}

function todayIso() {
  return isoFromDate(new Date());
}

function addDaysIso(isoDate, days) {
  var parts = isoDate.split("-");
  return isoFromDate(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + days));
}

// "2026-10-27" -> "27/10/2026"
function formatDateSlash(isoDate) {
  if (!isoDate) { return ""; }
  var parts = isoDate.split("-");
  return parts[2] + "/" + parts[1] + "/" + parts[0];
}

// "2026-10-27" -> "मंगलवार" / "Tuesday"
function dayNameOf(isoDate) {
  if (!isoDate) { return ""; }
  var parts = isoDate.split("-");
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return DAY_NAMES[currentLang][d.getDay()];
}

// "2026-10-27" -> "27/10/2026, मंगलवार"
function dateWithDay(isoDate) {
  if (!isoDate) { return ""; }
  return formatDateSlash(isoDate) + ", " + dayNameOf(isoDate);
}

// "16:00" -> "शाम 4:00 बजे" / "4:00 PM"
function timeInWords(timeValue) {
  if (!timeValue) { return ""; }
  var parts = timeValue.split(":");
  var hour = Number(parts[0]);
  var minute = parts[1];
  var hour12 = hour % 12;
  if (hour12 === 0) { hour12 = 12; }
  if (currentLang === "en") {
    return hour12 + ":" + minute + (hour < 12 ? " AM" : " PM");
  }
  var period = "रात";
  if (hour >= 4 && hour < 12) { period = "सुबह"; }
  else if (hour >= 12 && hour < 16) { period = "दोपहर"; }
  else if (hour >= 16 && hour < 19) { period = "शाम"; }
  return period + " " + hour12 + ":" + minute + " बजे";
}

function joinFilled(parts, separator) {
  var filled = [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i]) { filled.push(parts[i]); }
  }
  return filled.join(separator);
}

function copyText(text, onDone, onFail) {
  try {
    navigator.clipboard.writeText(text).then(onDone, onFail);
  } catch (e) {
    onFail();
  }
}

function isPhone() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// =====================================================================
// KHABAR INTEQAL — form text in Hindi and English
// =====================================================================

var DT = {
  hi: {
    exampleNote: "यह उदाहरण है। अपनी जानकारी भरने के लिए साफ़ करें।",
    clearAll: "सब साफ़ करें",
    secType: "सूचना का प्रकार",
    kindLabel: "क्या भेजना है?",
    secPerson: "मरहूम / मरहूमा की जानकारी",
    genderLabel: "मर्द / औरत",
    ageLabel: "उम्र",
    agePh: "उदाहरण: 85",
    nameLabel: "नाम",
    namePh: "उदाहरण: कमालुद्दीन दितावत",
    urfLabel: "उर्फ़ (घर का नाम)",
    urfPh: "उदाहरण: मल्ला भाई",
    familyLabel: "रिश्ता और खानदान",
    familyPh: "उदाहरण: मरहूम जमालुद्दीन मारोठ के दितावत, छावनी वालों के लड़के",
    causeLabel: "इंतक़ाल कैसे हुआ",
    secPlace: "जगह और तारीख",
    cityLabel: "शहर",
    cityPh: "उदाहरण: इंदौर",
    stateLabel: "राज्य",
    dateLabel: "तारीख",
    addressLabel: "पता",
    addressPh: "उदाहरण: हेड पोस्ट ऑफिस के सामने, तलोद",
    secTadfin: "तदफ़ीन",
    whenLabel: "कब",
    timeLabel: "समय",
    janazaLabel: "नमाज़े जनाज़ा — मस्जिद",

// Text of the chosen option in the current language ("" for the empty choice).
function optionText(options, value) {
  if (value === "" || value === "none") { return ""; }
  for (var i = 0; i < options.length; i++) {
    if (options[i][0] === value) {
      return currentLang === "en" ? options[i][2] : options[i][1];
    }
  }
  return "";
}

function fillSelect(select, options) {
  var keepValue = select.value;
  select.innerHTML = "";
  for (var i = 0; i < options.length; i++) {
    var option = document.createElement("option");
    option.value = options[i][0];
    option.textContent = currentLang === "en" ? options[i][2] : options[i][1];
    select.appendChild(option);
  }
  if (keepValue !== "") { select.value = keepValue; }
}

function word(key) {
  return WORDS[currentLang][key];
}

function marhoomWord(data) {
  return data.female ? word("marhooma") : word("marhoom");
}

function fullName(data) {
  var name = data.name || "—";
  if (data.urf) { name = name + " " + word("urf") + " " + data.urf; }
  return name;
}

function ageText(data) {
  if (!data.age) { return ""; }
  return word("age") + " " + data.age + " " + word("years");
}

function qabristanText(data) {
  if (!data.qabristan) { return ""; }
  if (currentLang === "en") { return "Burial at " + data.qabristan + "."; }
  return data.qabristan + " में सुपुर्दे ख़ाक किया जाएगा।";
}

function closingText(data) {
  if (currentLang === "en") {
    return "May Allah grant the " + marhoomWord(data) + " Maghfirah. Ameen.";
  }
  return "अल्लाह तआला " + marhoomWord(data) + " की मग़फ़िरत फ़रमाए। आमीन।";
}

// Main line, e.g. "मरहूम जमालुद्दीन ... के लड़के कमालुद्दीन उर्फ़ मल्ला भाई उम्र 85 साल का क़ज़ाए इलाही से इंतक़ाल हो गया है।"
function inteqalSentence(data, boldName) {
  var namePart = fullName(data);
  if (boldName) { namePart = "*" + namePart + "*"; }
  if (currentLang === "en") {
    var subject = joinFilled([namePart, data.family, data.age ? "aged " + data.age : ""], ", ");
    return joinFilled([subject, "has passed away", data.cause], " ") + ".";
  }
  return joinFilled([data.family, namePart, ageText(data), "का", data.cause, "इंतक़ाल हो गया है।"], " ");
}

function eventTiming(dateIso, when, time) {
  return joinFilled([dateWithDay(dateIso), joinFilled([when, timeInWords(time)], ", ")], " — ");
}

function eventName(kind) {
  return kind === "ziyarat" ? word("ziyarat") : word("fateha");
}

function eventSentence(data, kind, boldName) {
  var isZiyarat = kind === "ziyarat";
  var dateIso = isZiyarat ? data.ziyaratDate : data.fatehaDate;
  var when = joinFilled([isZiyarat ? data.ziyaratWhen : data.fatehaWhen, timeInWords(isZiyarat ? data.ziyaratTime : data.fatehaTime)], ", ");
  var place = isZiyarat ? data.ziyaratPlace : data.fatehaPlace;
  var namePart = fullName(data);
  if (boldName) { namePart = "*" + namePart + "*"; }
  if (currentLang === "en") {
    return joinFilled(["The " + eventName(kind) + " of " + marhoomWord(data) + " " + namePart + " will be held", dateWithDay(dateIso) ? "on " + dateWithDay(dateIso) : "", when, place ? "at " + place : ""], ", ") + ". In sha Allah.";
  }
  return joinFilled([marhoomWord(data), namePart, "की", eventName(kind), dateWithDay(dateIso), when, place ? place + " में" : "", "होगी। इन शा अल्लाह।"], " ");
}

function cityLine(data) {
  return joinFilled([data.city, data.state], ", ");
}

// ---------------- WhatsApp text in the samaj style ----------------
function buildDeathText(data) {
  var lines = [];
  lines.push("⚫⚫⚫⚫⚫⚫⚫");
  lines.push("*⚫ " + word("title")[data.kind] + " ⚫*");
  lines.push("_*إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ*_");
  lines.push("_*" + word("duaFull") + "*_");
  lines.push("");
  if (cityLine(data)) { lines.push("*" + cityLine(data) + "*"); }
  if (data.date) { lines.push(dateWithDay(data.date)); }
  if (data.address) { lines.push("*" + word("address") + ":* " + data.address); }
  lines.push("");

  if (data.kind === "inteqal") {
    lines.push(inteqalSentence(data, true));
    lines.push("");
    lines.push("*⚫ " + word("tadfin") + " ⚫*");
    lines.push(eventTiming(data.tadfinDate, data.tadfinWhen, data.tadfinTime));
    if (data.janaza) { lines.push("*" + word("janaza") + ":* " + data.janaza); }
    if (data.qabristan) { lines.push(qabristanText(data)); }
    if (data.addZiyarat) {
      lines.push("");
      lines.push("*⚫ " + word("ziyarat") + " ⚫*");
      lines.push(joinFilled([eventTiming(data.ziyaratDate, data.ziyaratWhen, data.ziyaratTime), data.ziyaratPlace], " — "));
    }
    if (data.addFateha) {
      lines.push("");
      lines.push("*⚫ " + word("fateha") + " ⚫*");
      lines.push(joinFilled([eventTiming(data.fatehaDate, data.fatehaWhen, data.fatehaTime), data.fatehaPlace], " — "));
    }
    if (data.jawai) { lines.push(""); lines.push("*⚫ " + word("jawai") + " ⚫*"); lines.push(data.jawai); }
    if (data.pihar) { lines.push(""); lines.push("*⚫ " + word("pihar") + " ⚫*"); lines.push(data.pihar); }
  } else {
    lines.push(eventSentence(data, data.kind, true));
  }

  if (data.by.length > 0) {
    lines.push("");
    lines.push("*⚫ " + word("by") + " ⚫*");
    for (var i = 0; i < data.by.length; i++) { lines.push(data.by[i]); }
  }
  if (data.groupLine) {
    lines.push("➖➖➖➖➖➖➖");
    lines.push("_" + data.groupLine + "_");
    lines.push("➖➖➖➖➖➖➖");
  }
  return lines.join("\n");
}

var CARD_W = 1080;

var CENTER_X = CARD_W / 2;
var COL = {
  ink: "#1f2937",
  muted: "#5f5a50",
  gold: "#b08d4f",
  goldDark: "#8a6a32",
  goldSoft: "#d8c296",
  archFill: "#ebe6dd",
  leaf: "#7c9a68",
  leafDark: "#56764a",
  boxFill: "rgba(222, 202, 160, 0.26)"
};
var FONT_HINDI = '"Noto Serif Devanagari", "Nirmala UI", "Mangal", serif';
var FONT_ARABIC = '"Amiri", "Traditional Arabic", "Arial", serif';
var ARCH = { x: CENTER_X - 150, y: 96, w: 300, h: 370 };

// ---------------------------------------------------------------------
// Some phones report a wrong text width for Hindi text on a canvas,
// which pushes centred text to the right. We draw a sample once per font,
// count the real pixels, and correct every width with that ratio.
// ---------------------------------------------------------------------
var inkCanvas = document.createElement("canvas");
inkCanvas.width = 3000;
inkCanvas.height = 220;
var widthRatioCache = {};
var SAMPLE_HINDI = "इन्ना लिल्लाहि व इन्ना इलैहि राजिऊन 28/10/2026 Abdul";
var SAMPLE_ARABIC = "إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ";

function widthRatioFor(ctx) {
  var key = ctx.font + "|" + ctx.direction;
  if (widthRatioCache[key] !== undefined) { return widthRatioCache[key]; }
  var sample = ctx.font.indexOf("Amiri") >= 0 ? SAMPLE_ARABIC : SAMPLE_HINDI;
  var ink = inkCanvas.getContext("2d", { willReadFrequently: true });
  ink.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  ink.font = ctx.font;
  ink.direction = "ltr";
  ink.textAlign = "left";
  ink.textBaseline = "alphabetic";
  ink.fillStyle = "#000000";
  ink.fillText(sample, 100, 150);
  var reported = ink.measureText(sample).width;
  var pixels = ink.getImageData(0, 0, inkCanvas.width, inkCanvas.height).data;
  var leftMost = -1;
  var rightMost = -1;
  for (var x = 0; x < inkCanvas.width; x++) {
    for (var y = 0; y < inkCanvas.height; y++) {
      if (pixels[(y * inkCanvas.width + x) * 4 + 3] > 0) {
        if (leftMost < 0) { leftMost = x; }
        rightMost = x;
        break;
      }
    }
  }
  var ratio = 1;
  if (leftMost >= 0 && reported > 0) {
    var real = rightMost - leftMost + 1;
    ratio = real / reported;
    // Small differences are normal (letter edges); only fix real mistakes.
    if (Math.abs(ratio - 1) < 0.06) { ratio = 1; }
  }
  widthRatioCache[key] = ratio;
  return ratio;
}

function trueWidth(ctx, text) {
  return ctx.measureText(text).width * widthRatioFor(ctx);
}

// Draws text; centred text is placed by hand using the corrected width.
function drawText(ctx, text, x, y) {
  if (ctx.textAlign !== "center") {
    ctx.fillText(text, x, y);
    return;
  }
  var width = trueWidth(ctx, text);
  ctx.textAlign = "left";
  if (ctx.direction === "rtl") {
    ctx.textAlign = "right";
    ctx.fillText(text, x + width / 2, y);
  } else {
    ctx.fillText(text, x - width / 2, y);
  }
  ctx.textAlign = "center";
}

function setFont(ctx, weight, size, family) {
  ctx.font = weight + " " + size + "px " + family;
}

function wrapText(ctx, text, maxWidth) {
  var words = text.split(" ");
  var lines = [];
  var line = "";
  for (var i = 0; i < words.length; i++) {
    var test = line === "" ? words[i] : line + " " + words[i];
    if (trueWidth(ctx, test) > maxWidth && line !== "") {
      lines.push(line);
      line = words[i];
    } else {
      line = test;
    }
  }
  if (line !== "") { lines.push(line); }
  return lines;
}

function drawWrappedCentered(ctx, text, centerX, y, maxWidth, lineHeight) {
  var lines = wrapText(ctx, text, maxWidth);
  ctx.textAlign = "center";
  for (var i = 0; i < lines.length; i++) {
    drawText(ctx, lines[i], centerX, y);
    y = y + lineHeight;
  }
  return y;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function archPath(ctx, x, y, w, h) {
  var r = w / 2;
  ctx.beginPath();
  ctx.moveTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, 0);
  ctx.lineTo(x + w, y + h - 28);
  ctx.quadraticCurveTo(x + w, y + h, x + w - 28, y + h);
  ctx.lineTo(x + 28, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - 28);
  ctx.closePath();
}

// Small repeatable random numbers so the flowers look the same on every redraw.
function makeRandom(seed) {
  var value = seed;
  return function () {
    value = (value * 9301 + 49297) % 233280;
    return value / 233280;
  };
}

function drawLeaf(ctx, x, y, length, width, angleDeg, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angleDeg * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(length * 0.45, -width, length, 0);
  ctx.quadraticCurveTo(length * 0.45, width, 0, 0);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.lineTo(length * 0.88, 0);
  ctx.stroke();
  ctx.restore();
}

function drawLily(ctx, cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.shadowColor = "rgba(80, 70, 50, 0.18)";
  ctx.shadowBlur = 14;
  for (var i = 0; i < 6; i++) {
    var r = (i % 2 === 0) ? size : size * 0.86;
    ctx.save();
    ctx.rotate((i * 60 + 18) * Math.PI / 180);
    var gradient = ctx.createLinearGradient(0, 0, r, 0);
    gradient.addColorStop(0, "#f4efe2");
    gradient.addColorStop(0.5, "#ffffff");
    gradient.addColorStop(1, "#fbf8f1");
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(r * 0.3, -r * 0.3, r * 0.8, -r * 0.24, r, 0);
    ctx.bezierCurveTo(r * 0.8, r * 0.24, r * 0.3, r * 0.3, 0, 0);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(160, 150, 125, 0.35)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  for (var k = 0; k < 6; k++) {
    var angle = (k * 60 + 45) * Math.PI / 180;
    var ex = Math.cos(angle) * size * 0.42;
    var ey = Math.sin(angle) * size * 0.42;
    ctx.strokeStyle = "#a8b98a";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.fillStyle = "#9a5b2e";
    ctx.beginPath();
    ctx.ellipse(ex, ey, 6, 3.5, angle, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBabyBreath(ctx, cx, cy, count, spread, seed) {
  var random = makeRandom(seed);
  for (var i = 0; i < count; i++) {
    var px = cx + (random() - 0.5) * spread * 2;
    var py = cy + (random() - 0.5) * spread * 2;
    ctx.strokeStyle = "rgba(124, 154, 104, 0.6)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + spread * 0.6);
    ctx.quadraticCurveTo((cx + px) / 2, py + 10, px, py);
    ctx.stroke();
    for (var p = 0; p < 5; p++) {
      var a = p * 72 * Math.PI / 180;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(px + Math.cos(a) * 3.6, py + Math.sin(a) * 3.6, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#e8dfc8";
    ctx.beginPath();
    ctx.arc(px, py, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawDecorations(ctx, H) {
  // Top-left: leaves, small white flowers and one lily (drawn a little smaller).
  ctx.save();
  ctx.scale(0.78, 0.78);
  drawLeaf(ctx, 0, 380, 190, 40, -62, COL.leafDark);
  drawLeaf(ctx, 30, 300, 170, 36, -28, COL.leaf);
  drawLeaf(ctx, 150, 90, 190, 36, -8, COL.leaf);
  drawLeaf(ctx, 120, 40, 160, 32, -30, COL.leafDark);
  drawLeaf(ctx, 230, 210, 150, 30, 24, COL.leaf);
  drawLeaf(ctx, 90, 280, 140, 30, 48, COL.leafDark);
  drawLeaf(ctx, 0, 470, 150, 32, -80, COL.leaf);
  drawBabyBreath(ctx, 330, 90, 16, 55, 11);
  drawBabyBreath(ctx, 290, 250, 10, 40, 23);
  drawBabyBreath(ctx, 70, 440, 12, 45, 37);
  drawBabyBreath(ctx, 40, 120, 8, 35, 41);
  drawLily(ctx, 165, 190, 108);
  ctx.restore();

  // Bottom-left: small white flowers and leaves.
  drawLeaf(ctx, 0, H - 90, 170, 34, -35, COL.leaf);
  drawLeaf(ctx, 40, H - 40, 160, 30, -10, COL.leafDark);
  drawBabyBreath(ctx, 120, H - 130, 18, 60, 53);
  drawBabyBreath(ctx, 60, H - 210, 10, 40, 67);

  // Bottom-right: golden leaves.
  var goldLeaf = "rgba(176, 141, 79, 0.75)";
  drawLeaf(ctx, CARD_W - 50, H - 50, 190, 30, -125, goldLeaf);
  drawLeaf(ctx, CARD_W - 45, H - 60, 170, 26, -100, goldLeaf);
  drawLeaf(ctx, CARD_W - 60, H - 45, 160, 26, -150, goldLeaf);
  drawLeaf(ctx, CARD_W - 44, H - 70, 130, 22, -84, "rgba(176, 141, 79, 0.55)");
}

function drawBackground(ctx, H) {
  var gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#fbf8f1");
  gradient.addColorStop(1, "#f1e9db");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, CARD_W, H);

  var glow = ctx.createRadialGradient(CENTER_X, H * 0.42, 40, CENTER_X, H * 0.42, CARD_W * 0.8);
  glow.addColorStop(0, "rgba(255,255,255,0.65)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CARD_W, H);

  roundRectPath(ctx, 34, 34, CARD_W - 68, H - 68, 28);
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawStar(ctx, cx, cy, outer, inner) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var r = (i % 2 === 0) ? outer : inner;
    var a = (i * 36 - 90) * Math.PI / 180;
    var px = cx + Math.cos(a) * r;
    var py = cy + Math.sin(a) * r;
    if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
  }
  ctx.closePath();
  ctx.fill();
}


// Top of the card: crescent and star, the dua in Arabic, and its reading.
function drawTopBlessing(ctx) {
  var moonX = CENTER_X - 6;
  var moonY = 118;
  ctx.save();
  ctx.beginPath();
  ctx.arc(moonX, moonY, 36, 0, Math.PI * 2);
  ctx.clip();
  ctx.beginPath();
  ctx.rect(moonX - 40, moonY - 40, 80, 80);
  ctx.arc(moonX + 16, moonY - 8, 31, 0, Math.PI * 2, true);
  ctx.fillStyle = COL.gold;
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = COL.gold;
  drawStar(ctx, moonX + 22, moonY - 4, 11, 4.5);

  ctx.textAlign = "center";
  ctx.direction = "rtl";
  setFont(ctx, "700", 42, FONT_ARABIC);
  ctx.fillStyle = COL.ink;
  drawText(ctx, "إِنَّا لِلَّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ", CENTER_X, 222);
  ctx.direction = "ltr";
  setFont(ctx, "400", 24, FONT_HINDI);
  ctx.fillStyle = COL.muted;
  drawText(ctx, word("duaFull"), CENTER_X, 268);
  drawDivider(ctx, CENTER_X, 304, 120);
}

function detailsBoxFor(data) {
  if (data.kind === "inteqal") {
    return {
      title: word("tadfin"),
      columns: [
        { icon: "calendar", label: word("colDate"), value: dateWithDay(data.tadfinDate) },
        { icon: "clock", label: word("colTime"), value: joinFilled([data.tadfinWhen, timeInWords(data.tadfinTime)], ", ") },
        { icon: "mosque", label: word("colJanaza"), value: data.janaza }
      ],
      bottom: qabristanText(data)
    };
  }
  var isZiyarat = data.kind === "ziyarat";
  return {
    title: eventName(data.kind),
    columns: [
      { icon: "calendar", label: word("colDate"), value: dateWithDay(isZiyarat ? data.ziyaratDate : data.fatehaDate) },
      { icon: "clock", label: word("colTime"), value: isZiyarat ? joinFilled([data.ziyaratWhen, timeInWords(data.ziyaratTime)], ", ") : joinFilled([data.fatehaWhen, timeInWords(data.fatehaTime)], ", ") },
      { icon: "pin", label: word("colPlace"), value: isZiyarat ? data.ziyaratPlace : data.fatehaPlace }
    ],
    bottom: ""
  };
}

function cardParagraph(data) {
  if (data.kind === "inteqal") { return inteqalSentence(data, false); }
  if (currentLang === "en") {
    return "The " + eventName(data.kind) + " of " + marhoomWord(data) + " " + fullName(data) + " will be held, In sha Allah. Everyone is requested to attend.";
  }
  return marhoomWord(data) + " " + fullName(data) + " की " + eventName(data.kind) + " होगी। इन शा अल्लाह। आप सब से शिरकत की गुज़ारिश है।";
}

// Draws the whole card and returns the y position where the content ends.
function drawCard(ctx, data, H) {
  drawBackground(ctx, H);
  drawDecorations(ctx, H);
  drawTopBlessing(ctx);

  var y = 388;
  drawHeading(ctx, word("title")[data.kind], y);

  // Name: shrink to fit, wrap only if still too long.
  y = y + 100;
  var nameText = data.name || "—";
  var nameSize = 76;
  setFont(ctx, "700", nameSize, FONT_HINDI);
  while (trueWidth(ctx, nameText) > 860 && nameSize > 50) {
    nameSize = nameSize - 2;
    setFont(ctx, "700", nameSize, FONT_HINDI);
  }
  ctx.fillStyle = COL.ink;
  y = drawWrappedCentered(ctx, nameText, CENTER_X, y, 860, nameSize + 14) - (nameSize + 14);

  if (data.urf) {
    y = y + 54;
    setFont(ctx, "400", 30, FONT_HINDI);
    ctx.fillStyle = COL.muted;
    ctx.textAlign = "center";
    drawText(ctx, "(" + word("urf") + " " + data.urf + ")", CENTER_X, y);
  }

  y = y + 44;
  drawDivider(ctx, CENTER_X, y, 120);

  if (data.age) {
    y = y + 54;
    setFont(ctx, "400", 30, FONT_HINDI);
    ctx.fillStyle = COL.muted;
    ctx.textAlign = "center";
    drawText(ctx, ageText(data), CENTER_X, y);
  }

  var placeDate = joinFilled([dateWithDay(data.date), cityLine(data)], "  ·  ");
  if (placeDate) {
    y = y + 54;
    setFont(ctx, "400", 29, FONT_HINDI);
    ctx.fillStyle = COL.ink;
    ctx.textAlign = "center";
    var halfWidth = trueWidth(ctx, placeDate) / 2;
    if (halfWidth < 400) {
      drawText(ctx, placeDate, CENTER_X + 22, y);
      drawCalendarIcon(ctx, CENTER_X - halfWidth - 14, y - 10, 30);
    } else {
      y = drawWrappedCentered(ctx, placeDate, CENTER_X, y, 840, 42) - 42;
    }
  }

  y = y + 66;
  setFont(ctx, "400", 31, FONT_HINDI);
  ctx.fillStyle = COL.ink;
  y = drawWrappedCentered(ctx, cardParagraph(data), CENTER_X, y, 840, 50);

  if (data.address) {
    setFont(ctx, "400", 26, FONT_HINDI);
    ctx.fillStyle = COL.muted;
    y = drawWrappedCentered(ctx, word("address") + ": " + data.address, CENTER_X, y + 2, 820, 40);
  }

  y = drawDetailsBox(ctx, detailsBoxFor(data), y + 14);

  var extras = [];
  if (data.kind === "inteqal") {
    if (data.addZiyarat) { extras.push([word("ziyarat"), joinFilled([eventTiming(data.ziyaratDate, data.ziyaratWhen, data.ziyaratTime), data.ziyaratPlace], " — ")]); }
    if (data.addFateha) { extras.push([word("fateha"), joinFilled([eventTiming(data.fatehaDate, data.fatehaWhen, data.fatehaTime), data.fatehaPlace], " — ")]); }
    if (data.jawai) { extras.push([word("jawai"), data.jawai]); }
    if (data.pihar) { extras.push([word("pihar"), data.pihar]); }
  }
  if (extras.length > 0) {
    y = y + 56;
    for (var i = 0; i < extras.length; i++) {
      y = drawLabelValue(ctx, extras[i][0], extras[i][1] || "—", y);
    }
    y = y - 44;
  }

  y = y + 70;
  setFont(ctx, "400", 30, FONT_HINDI);
  ctx.fillStyle = COL.ink;
  y = drawWrappedCentered(ctx, closingText(data), CENTER_X, y, 840, 44) - 44;

  y = y + 40;
  drawDivider(ctx, CENTER_X, y, 110);

  if (data.by.length > 0) {
    y = y + 48;
    setFont(ctx, "600", 25, FONT_HINDI);
    ctx.fillStyle = COL.goldDark;
    ctx.textAlign = "center";
    drawText(ctx, word("by"), CENTER_X, y);
    setFont(ctx, "400", 26, FONT_HINDI);
    ctx.fillStyle = COL.muted;
    y = y + 6;
    for (var b = 0; b < data.by.length; b++) {
      y = drawWrappedCentered(ctx, data.by[b], CENTER_X, y + 38, 760, 38) - 38;
    }
  }

  if (data.groupLine) {
    y = y + 52;
    setFont(ctx, "400", 22, FONT_HINDI);
    ctx.fillStyle = COL.muted;
    y = drawWrappedCentered(ctx, data.groupLine, CENTER_X, y, 720, 32) - 32;
  }
  return y;
}

var measureCanvas = document.createElement("canvas");
measureCanvas.width = CARD_W;
measureCanvas.height = 3400;

function renderCard() {
  var data = readDeathData();
  var bottom = drawCard(measureCanvas.getContext("2d"), data, 3400);
  var height = Math.max(CARD_MIN_H, Math.ceil(bottom + 150));
  var canvas = getById("cardCanvas");
  if (canvas.height !== height) { canvas.height = height; }
  drawCard(canvas.getContext("2d"), data, height);
}

// =====================================================================
// KHABAR INTEQAL — page behaviour
// =====================================================================

var sendMode = "card";
var renderPending = false;

function updateDeath() {
  var data = readDeathData();
  getById("deathText").textContent = buildDeathText(data);
  getById("d_dayShow").textContent = data.date ? "(" + dayNameOf(data.date) + ")" : "";
  if (sendMode === "card" && !renderPending) {
    renderPending = true;
    requestAnimationFrame(function () {
      renderPending = false;
      renderCard();
    });
  }
}

// Show / hide sections depending on the notice type.
function applyDeathKind() {
  var kind = readInput("d_kind") || "inteqal";
  var isInteqal = kind === "inteqal";
  getById("sec_tadfin").hidden = !isInteqal;
  getById("sec_more").hidden = !isInteqal;
  getById("g_family").hidden = !isInteqal;
  getById("g_cause").hidden = !isInteqal;

  getById("sec_ziyarat").hidden = !(isInteqal || kind === "ziyarat");
  getById("sw_ziyarat").hidden = !isInteqal;
  getById("h_ziyarat").hidden = isInteqal;
  getById("body_ziyarat").hidden = isInteqal && !getById("d_addZiyarat").checked;

  getById("sec_fateha").hidden = !(isInteqal || kind === "fateha");
  getById("sw_fateha").hidden = !isInteqal;
  getById("h_fateha").hidden = isInteqal;
  getById("body_fateha").hidden = isInteqal && !getById("d_addFateha").checked;
  updateDeath();
}

function showSendHelp() {
  if (sendMode === "text") { setDeathNote(dt("helpText")); return; }
  setDeathNote(isPhone() ? dt("helpPhoneCard") : dt("helpComputerCard"));
}

function setSendMode(mode) {
  sendMode = mode;
  getById("modeCard").setAttribute("aria-pressed", mode === "card" ? "true" : "false");
  getById("modeText").setAttribute("aria-pressed", mode === "text" ? "true" : "false");
  getById("cardPreview").hidden = mode !== "card";
  getById("textDetails").open = mode === "text";
  showSendHelp();
  updateDeath();
}

function findDeathMissing(data) {
  var missing = [];
  var marks = ["w_name", "w_city", "w_date", "w_tadfinDate", "w_ziyaratDate", "w_fatehaDate"];
  for (var i = 0; i < marks.length; i++) { getById(marks[i]).classList.remove("bad"); }
  if (!data.name) { missing.push(dt("missName")); getById("w_name").classList.add("bad"); }
  if (!data.city) { missing.push(dt("missCity")); getById("w_city").classList.add("bad"); }
  if (!data.date) { missing.push(dt("missDate")); getById("w_date").classList.add("bad"); }
  if (data.kind === "inteqal" && !data.tadfinDate) { missing.push(dt("missTadfin")); getById("w_tadfinDate").classList.add("bad"); }
  if (data.kind === "ziyarat" && !data.ziyaratDate) { missing.push(dt("missZiyarat")); getById("w_ziyaratDate").classList.add("bad"); }
  if (data.kind === "fateha" && !data.fatehaDate) { missing.push(dt("missFateha")); getById("w_fatehaDate").classList.add("bad"); }
  return missing;
}

function checkDeathForm() {
  var data = readDeathData();
  var missing = findDeathMissing(data);
  var box = getById("deathErr");
  if (missing.length > 0) {
    box.textContent = dt("missing") + missing.join(", ");
    box.hidden = false;
    var firstBad = document.querySelector("#deathSection .field.bad input");
    if (firstBad) { firstBad.focus(); }
    return null;
  }
  box.hidden = true;
  return data;
}

function setDeathNote(text, highlight) {
  var note = getById("deathNote");
  note.textContent = text;
  if (highlight) { note.classList.add("guide"); } else { note.classList.remove("guide"); }
}

function cardFileName(data, extension) {
  var kindWord = { inteqal: "khabar-inteqal", ziyarat: "ziyarat", fateha: "fateha" };
  return kindWord[data.kind] + "-" + (data.date || todayIso()) + "." + extension;
}

// Turns the canvas picture into a file right away (no waiting),
// so the phone still allows opening the share menu.
function dataUrlToBlob(dataUrl) {
  var parts = dataUrl.split(",");
  var mimeType = parts[0].split(":")[1].split(";")[0];
  var binary = atob(parts[1]);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  return new Blob([bytes], { type: mimeType });
}

function downloadBlob(blob, fileName) {
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
}

// Short caption sent with the card, e.g. "*⚫ खबर इंतक़ाल ⚫* — मरहूम अब्दुल करीम"
function shortCaption(data) {
  return "*⚫ " + word("title")[data.kind] + " ⚫* — " + marhoomWord(data) + " " + fullName(data);
}

function openWhatsApp(messageText) {
  window.open("https://wa.me/" + SEND_TO_NUMBER + "?text=" + encodeURIComponent(messageText), "_blank");
}

function sendDeathNotice() {
  var data = checkDeathForm();
  if (!data) { return; }
  var messageText = buildDeathText(data);

  if (sendMode === "text") {
    openWhatsApp(messageText);
    setDeathNote(dt("helpText"));
    return;
  }

  renderCard();
  var canvas = getById("cardCanvas");

  // Phone: share menu with the card picture and the message as caption.
  if (isPhone()) {
    var jpegBlob = dataUrlToBlob(canvas.toDataURL("image/jpeg", 0.93));
    var file = new File([jpegBlob], cardFileName(data, "jpg"), { type: "image/jpeg" });
    var shareData = { files: [file] };
    if (navigator.canShare && navigator.canShare(shareData)) {
      navigator.share(shareData).then(function () {
        setDeathNote(dt("doneShared"));
      }, function (error) {
        if (error && error.name === "AbortError") { return; }
        setDeathNote(dt("shareFailed"));
      });
      return;
    }
  }

  // Computer: copy the card, then open WhatsApp with the message typed.
  var pngBlob = dataUrlToBlob(canvas.toDataURL("image/png"));
  try {
    navigator.clipboard.write([new ClipboardItem({ "image/png": pngBlob })]).then(function () {
      setDeathNote(dt("doneComputer"), true);
    }, function () {
      downloadBlob(pngBlob, cardFileName(data, "png"));
      setDeathNote(dt("doneComputerDownload"), true);
    });
  } catch (e) {
    downloadBlob(pngBlob, cardFileName(data, "png"));
    setDeathNote(dt("doneComputerDownload"), true);
  }
  // Open WhatsApp with an empty message box, so only the pasted card is sent.
  window.open("https://web.whatsapp.com/", "_blank");
}

function drawDivider(ctx, cx, y, halfLength) {
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - halfLength, y);
  ctx.lineTo(cx - 16, y);
  ctx.moveTo(cx + 16, y);
  ctx.lineTo(cx + halfLength, y);
  ctx.stroke();
  ctx.fillStyle = COL.gold;
  ctx.beginPath();
  ctx.moveTo(cx, y - 7);
  ctx.lineTo(cx + 7, y);
  ctx.lineTo(cx, y + 7);
  ctx.lineTo(cx - 7, y);
  ctx.closePath();
  ctx.fill();
}

function drawHeading(ctx, text, y) {
  setFont(ctx, "600", 40, FONT_HINDI);
  ctx.fillStyle = COL.ink;
  ctx.textAlign = "center";
  drawText(ctx, text, CENTER_X, y);
  var halfText = trueWidth(ctx, text) / 2;
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(CENTER_X - halfText - 30, y - 13);
  ctx.lineTo(CENTER_X - halfText - 190, y - 13);
  ctx.moveTo(CENTER_X + halfText + 30, y - 13);
  ctx.lineTo(CENTER_X + halfText + 190, y - 13);
  ctx.stroke();
}

function drawCalendarIcon(ctx, cx, cy, size) {
  var s = size;
  ctx.strokeStyle = COL.goldDark;
  ctx.lineWidth = 2.5;
  roundRectPath(ctx, cx - s / 2, cy - s / 2 + 4, s, s - 4, 5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - s / 2, cy - s / 2 + 14);
  ctx.lineTo(cx + s / 2, cy - s / 2 + 14);
  ctx.moveTo(cx - s / 4, cy - s / 2);
  ctx.lineTo(cx - s / 4, cy - s / 2 + 8);
  ctx.moveTo(cx + s / 4, cy - s / 2);
  ctx.lineTo(cx + s / 4, cy - s / 2 + 8);
  ctx.stroke();
  ctx.fillStyle = COL.goldDark;
  for (var row = 0; row < 2; row++) {
    for (var col = 0; col < 3; col++) {
      ctx.fillRect(cx - s / 3 + col * (s / 3) - 2, cy + 2 + row * (s / 5), 4, 4);
    }
  }
}

function drawClockIcon(ctx, cx, cy, size) {
  ctx.strokeStyle = COL.goldDark;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx, cy - size / 3);
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + size / 4, cy + size / 8);
  ctx.stroke();
}

function drawPinIcon(ctx, cx, cy, size) {
  var r = size / 2.6;
  ctx.strokeStyle = COL.goldDark;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy - r / 2, r, Math.PI * 0.85, Math.PI * 2.15);
  ctx.lineTo(cx, cy + size / 2);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy - r / 2, r / 2.6, 0, Math.PI * 2);
  ctx.stroke();
}

function drawMosqueIcon(ctx, cx, cy, size) {
  ctx.strokeStyle = COL.goldDark;
  ctx.lineWidth = 2.5;
  var half = size / 2;
  var baseY = cy + half;
  var bodyTop = cy + half * 0.1;
  // ground line
  ctx.beginPath();
  ctx.moveTo(cx - half * 1.1, baseY);
  ctx.lineTo(cx + half * 1.1, baseY);
  // main body
  ctx.moveTo(cx - half * 0.6, baseY);
  ctx.lineTo(cx - half * 0.6, bodyTop);
  ctx.lineTo(cx + half * 0.6, bodyTop);
  ctx.lineTo(cx + half * 0.6, baseY);
  ctx.stroke();
  // onion dome
  ctx.beginPath();
  ctx.moveTo(cx - half * 0.55, bodyTop);
  ctx.bezierCurveTo(cx - half * 0.75, cy - half * 0.45, cx - half * 0.1, cy - half * 0.55, cx, cy - half * 0.85);
  ctx.bezierCurveTo(cx + half * 0.1, cy - half * 0.55, cx + half * 0.75, cy - half * 0.45, cx + half * 0.55, bodyTop);
  ctx.stroke();
  // door arch
  ctx.beginPath();
  ctx.moveTo(cx - half * 0.18, baseY);
  ctx.lineTo(cx - half * 0.18, cy + half * 0.55);
  ctx.arc(cx, cy + half * 0.55, half * 0.18, Math.PI, 0);
  ctx.lineTo(cx + half * 0.18, baseY);
  ctx.stroke();
  // two minarets
  ctx.beginPath();
  ctx.moveTo(cx - half * 0.95, baseY);
  ctx.lineTo(cx - half * 0.95, cy - half * 0.45);
  ctx.moveTo(cx + half * 0.95, baseY);
  ctx.lineTo(cx + half * 0.95, cy - half * 0.45);
  ctx.stroke();
  ctx.fillStyle = COL.goldDark;
  ctx.beginPath();
  ctx.arc(cx - half * 0.95, cy - half * 0.55, 3, 0, Math.PI * 2);
  ctx.arc(cx + half * 0.95, cy - half * 0.55, 3, 0, Math.PI * 2);
  ctx.fill();
  // crescent tip on the dome
  ctx.beginPath();
  ctx.arc(cx, cy - half * 0.85 - 6, 3, 0, Math.PI * 2);
  ctx.fill();
}

// Box with title, three columns (date / time / place) and an optional bottom line.
function drawDetailsBox(ctx, box, y) {
  var x = 120;
  var w = CARD_W - 240;
  var colW = w / 3;
  setFont(ctx, "400", 25, FONT_HINDI);
  var columnLines = [];
  var maxLines = 1;
  for (var i = 0; i < box.columns.length; i++) {
    var value = box.columns[i].value || "—";
    var lines = wrapText(ctx, value, colW - 34);
    columnLines.push(lines);
    if (lines.length > maxLines) { maxLines = lines.length; }
  }
  var bottomLines = [];
  if (box.bottom) { bottomLines = wrapText(ctx, box.bottom, w - 70); }

  var columnsBottom = y + 196 + maxLines * 36;
  var height = columnsBottom - y + 10;
  if (bottomLines.length > 0) { height = height + 30 + bottomLines.length * 36; }

  roundRectPath(ctx, x, y, w, height, 22);
  ctx.fillStyle = COL.boxFill;
  ctx.fill();
  ctx.strokeStyle = COL.goldSoft;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  setFont(ctx, "600", 30, FONT_HINDI);
  ctx.fillStyle = COL.ink;
  ctx.textAlign = "center";
  drawText(ctx, box.title, CENTER_X, y + 52);
  var halfTitle = trueWidth(ctx, box.title) / 2;
  ctx.fillStyle = COL.gold;
  drawStar(ctx, CENTER_X - halfTitle - 24, y + 42, 9, 4);
  drawStar(ctx, CENTER_X + halfTitle + 24, y + 42, 9, 4);

  for (var c = 0; c < box.columns.length; c++) {
    var colCenter = x + colW * c + colW / 2;
    var icon = box.columns[c].icon;
    if (icon === "calendar") { drawCalendarIcon(ctx, colCenter, y + 108, 38); }
    if (icon === "clock") { drawClockIcon(ctx, colCenter, y + 108, 38); }
    if (icon === "pin") { drawPinIcon(ctx, colCenter, y + 108, 40); }
    if (icon === "mosque") { drawMosqueIcon(ctx, colCenter, y + 108, 40); }

    setFont(ctx, "600", 25, FONT_HINDI);
    ctx.fillStyle = COL.goldDark;
    ctx.textAlign = "center";
    drawText(ctx, box.columns[c].label, colCenter, y + 172);

    setFont(ctx, "400", 25, FONT_HINDI);
    ctx.fillStyle = COL.ink;
    for (var k = 0; k < columnLines[c].length; k++) {
      drawText(ctx, columnLines[c][k], colCenter, y + 212 + k * 36);
    }
    if (c > 0) {
      ctx.strokeStyle = COL.goldSoft;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + colW * c, y + 84);
      ctx.lineTo(x + colW * c, columnsBottom - 10);
      ctx.stroke();
    }
  }

  if (bottomLines.length > 0) {
    ctx.strokeStyle = COL.goldSoft;
    ctx.beginPath();
    ctx.moveTo(x + 40, columnsBottom + 6);
    ctx.lineTo(x + w - 40, columnsBottom + 6);
    ctx.stroke();
    setFont(ctx, "400", 25, FONT_HINDI);
    ctx.fillStyle = COL.ink;
    ctx.textAlign = "center";
    for (var b = 0; b < bottomLines.length; b++) {
      drawText(ctx, bottomLines[b], CENTER_X, columnsBottom + 46 + b * 36);
    }
  }
  return y + height;
}

// "जवाई: सामोद के तगाले" — gold label, dark value, centered; wraps if long.
function drawLabelValue(ctx, label, value, y) {
  var maxWidth = 840;
  setFont(ctx, "600", 27, FONT_HINDI);
  var labelText = label + ": ";
  var labelWidth = trueWidth(ctx, labelText);
  setFont(ctx, "400", 27, FONT_HINDI);
  var valueWidth = trueWidth(ctx, value);
  if (labelWidth + valueWidth <= maxWidth) {
    var startX = CENTER_X - (labelWidth + valueWidth) / 2;
    ctx.textAlign = "left";
    setFont(ctx, "600", 27, FONT_HINDI);
    ctx.fillStyle = COL.goldDark;
    drawText(ctx, labelText, startX, y);
    setFont(ctx, "400", 27, FONT_HINDI);
    ctx.fillStyle = COL.ink;
    drawText(ctx, value, startX + labelWidth, y);
    return y + 44;
  }
  setFont(ctx, "600", 27, FONT_HINDI);
  ctx.fillStyle = COL.goldDark;
  ctx.textAlign = "center";
  drawText(ctx, label, CENTER_X, y);
  setFont(ctx, "400", 27, FONT_HINDI);
  ctx.fillStyle = COL.ink;
  return drawWrappedCentered(ctx, value, CENTER_X, y + 40, maxWidth, 40) + 4;
}

  document.documentElement.lang = currentLang;
  getById("tTitle").textContent = text("title");
  getById("tSub").textContent = text("sub");
  getById("tStep1").textContent = text("step1");
  getById("tStep2").textContent = text("step2");
  getById("tStep3").textContent = text("step3");
  getById("tExtra").textContent = text("extra");
  getById("tSender").textContent = text("sender");
  getById("tOpt1").textContent = text("optional");
  getById("tOpt2").textContent = text("optional");
  getById("sendLink").textContent = text("send");
  getById("copyBtn").textContent = text("copy");
  getById("note").textContent = SEND_TO_NUMBER ? text("noteAdmin") : text("noteGroup");
  getById("langHi").setAttribute("aria-pressed", currentLang === "hi" ? "true" : "false");
  getById("langEn").setAttribute("aria-pressed", currentLang === "en" ? "true" : "false");
}

function drawTiles() {
  var box = getById("tiles");
  box.innerHTML = "";
  TYPES.forEach(function (type) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "tile";
    button.setAttribute("aria-pressed", type.id === currentType.id ? "true" : "false");
    var icon = document.createElement("span");
    icon.className = "ic";
    icon.textContent = type.icon;
    var label = document.createElement("span");
    label.textContent = type.name[currentLang];
    button.appendChild(icon);
    button.appendChild(label);
    button.addEventListener("click", function () { chooseType(type); });
    box.appendChild(button);
  });
}

function rememberValues() {
  if (currentType.special) { return; }
  currentType.fields.forEach(function (field) {
    var input = getById("f_" + field.key);
    if (input) { savedValues[field.key] = input.value; }
  });
}

function drawFields() {
  var box = getById("fields");
  box.innerHTML = "";
  if (currentType.special) { return; }
  currentType.fields.forEach(function (field) {
    var wrap = document.createElement("div");
    wrap.className = "field";
    wrap.id = "w_" + field.key;

    var label = document.createElement("label");
    label.setAttribute("for", "f_" + field.key);
    label.textContent = field[currentLang] + " ";
    var mark = document.createElement("span");
    if (field.required) { mark.className = "req"; mark.textContent = "*"; }
    else { mark.className = "opt"; mark.textContent = text("optional"); }
    label.appendChild(mark);

    var input;
    if (field.kind === "long") {
      input = document.createElement("textarea");
    } else {
      input = document.createElement("input");
      if (field.kind === "date") { input.type = "date"; }
      if (field.kind === "tel") { input.type = "tel"; input.inputMode = "tel"; }
    }
    input.id = "f_" + field.key;
    var example = currentLang === "hi" ? field.exHi : field.exEn;
    if (example) { input.placeholder = text("example") + example; }
    if (savedValues[field.key] !== undefined) { input.value = savedValues[field.key]; }
    else if (field.kind === "date") { input.value = todayIso(); }

    input.addEventListener("input", updatePreview);
    wrap.appendChild(label);
    wrap.appendChild(input);
    box.appendChild(wrap);
  });
}

function chooseType(type) {
  rememberValues();
  currentType = type;
  getById("deathSection").hidden = !type.special;
  getById("genericSection").hidden = !!type.special;
  drawTiles();
  drawFields();
  hideError();
  updatePreview();
  if (type.special) { updateDeath(); }
}

function changeLanguage(lang) {
  rememberValues();
  currentLang = lang;
  try { localStorage.setItem("samajLang", lang); } catch (e) {}
  drawStaticText();
  applyDeathLanguage();
  if (!getById("exampleBar").hidden) { fillDeathExample(); applyDeathKind(); }
  drawTiles();
  drawFields();
  updatePreview();
  updateDeath();
}

function readValue(key) {
  var input = getById("f_" + key);
  if (!input) { return ""; }
  return input.value.trim();
}

function introLine(type) {
  var hi = currentLang === "hi";
  if (type.id === "marriage" || type.id === "engagement") {
    var groom = readValue("groom");
    var bride = readValue("bride");
    if (groom && bride) { return hi ? "*" + groom + "* संग *" + bride + "*" : "*" + groom + "* & *" + bride + "*"; }
    return "";
  }
  if (type.id === "birth") {
    var parents = readValue("parents");
    if (!parents) { return ""; }
    var baby = readValue("baby");
    if (hi) { return parents + " के घर " + (baby || "बच्चे") + " की पैदाइश हुई है। मुबारकबाद!"; }
    return parents + " are blessed with " + (baby || "a baby") + ". Congratulations!";
  }
  return "";
}

function buildMessage() {
  if (currentType.special) { return ""; }
  var lines = [];
  lines.push(currentType.header[currentLang]);
  lines.push("");
  var intro = introLine(currentType);
  if (intro) { lines.push(intro); lines.push(""); }
  currentType.fields.forEach(function (field) {
    if (field.intro) { return; }
    var value = readValue(field.key);
    if (!value) { return; }
    if (field.kind === "date") { value = formatDateSlash(value); }
    if (field.kind === "long") {
      lines.push("*" + field[currentLang] + ":*");
      lines.push(value);
    } else {
      lines.push("*" + field[currentLang] + ":* " + value);
    }
  });
  var extra = getById("f_extra").value.trim();
  if (extra) { lines.push(""); lines.push(extra); }
  var sender = getById("f_sender").value.trim();
  if (sender) { lines.push(""); lines.push(text("sharedBy") + sender); }
  return lines.join("\n");
}

function updatePreview() {
  var message = buildMessage();
  getById("preview").textContent = message;
  getById("sendLink").href = "https://wa.me/" + SEND_TO_NUMBER + "?text=" + encodeURIComponent(message);
}

function findMissingFields() {
  var missing = [];
  currentType.fields.forEach(function (field) {
    var wrap = getById("w_" + field.key);
    wrap.classList.remove("bad");
    if (field.required && readValue(field.key) === "") {
      missing.push(field[currentLang]);
      wrap.classList.add("bad");
    }
  });
  return missing;
}

function hideError() { getById("errBox").hidden = true; }

getById("sendLink").addEventListener("click", function (event) {
  var missing = findMissingFields();
  if (missing.length > 0) {
    event.preventDefault();
    var box = getById("errBox");
    box.textContent = text("missing") + missing.join(", ");
    box.hidden = false;
    var firstBad = document.querySelector("#genericSection .field.bad input, #genericSection .field.bad textarea");
    if (firstBad) { firstBad.focus(); }
    return;
  }
  hideError();
});

function selectPreview() {
  var range = document.createRange();
  range.selectNodeContents(getById("preview"));
  var selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  getById("note").textContent = text("selectHint");
}

getById("copyBtn").addEventListener("click", function () {
  copyText(buildMessage(), function () {
    getById("note").textContent = text("copied");
  }, selectPreview);
});

getById("langHi").addEventListener("click", function () { changeLanguage("hi"); });
getById("langEn").addEventListener("click", function () { changeLanguage("en"); });
getById("f_extra").addEventListener("input", updatePreview);
getById("f_sender").addEventListener("input", updatePreview);

// =====================================================================
// START
// =====================================================================

applyDeathLanguage();
getById("d_group").value = DEFAULT_GROUP_LINE;
getById("d_date").value = todayIso();
getById("d_tadfinDate").value = todayIso();
if (FILL_EXAMPLE) { fillDeathExample(); }

drawStaticText();
applyDeathLanguage();
drawTiles();
chooseType(TYPES[0]);
applyDeathKind();

// Redraw the card once the Hindi and Arabic fonts have loaded.
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('400 30px "Noto Serif Devanagari"', "अ Aa 0123"),
    document.fonts.load('600 30px "Noto Serif Devanagari"', "अ Aa 0123"),
    document.fonts.load('700 70px "Noto Serif Devanagari"', "अ Aa 0123"),
    document.fonts.load('400 34px "Amiri"', "إِنَّا"),
    document.fonts.load('700 38px "Amiri"', "إِنَّا")
  ]).then(updateDeath, updateDeath);
}
</script>
</body>
</html>
